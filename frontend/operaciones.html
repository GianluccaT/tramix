<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAMIX · Operaciones</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="barra-superior" id="barra-superior"></header>

  <div class="contenedor">
    <nav class="menu-lateral" id="menu-lateral"></nav>

    <main class="contenido">
      <h2>Listado de operaciones</h2>
      <p class="subtitulo">Operaciones obtenidas desde el backend (GET /api/operaciones), con búsqueda y filtros.</p>

      <div id="aviso" class="aviso oculto"></div>

      <section class="tarjeta">
        <!-- Filtros aplicados sobre los datos simulados (RF07) -->
        <div class="filtros">
          <input type="search" id="busqueda" placeholder="Buscar por N° de operación o proveedor…">
          <select id="filtro-etapa"></select>
          <select id="filtro-importador"></select>
          <select id="filtro-transporte"></select>
          <button type="button" class="boton secundario" id="boton-limpiar">Limpiar</button>
        </div>

        <table class="datos">
          <thead>
            <tr>
              <th>N° operación</th>
              <th>Importador</th>
              <th>Transporte</th>
              <th>Arribo</th>
              <th>Docs.</th>
              <th>Etapa</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>

        <p class="nota" id="contador"></p>
      </section>

      <div class="pie-demo" id="pie-demo"></div>
    </main>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/comunes.js"></script>
  <script src="js/api.js"></script>
  <script src="js/operaciones.js"></script>
</body>
</html>
